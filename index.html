<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Care Rota</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--soft:#f7f7fa;--blue:#007aff;--night:#eceaf5}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mute:#8e8e93;--line:#38383a;--soft:#232326;--blue:#0a84ff;--night:#25233a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.bar h1{font-size:28px;margin:0;letter-spacing:-.5px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--mute)}
.pill.live{color:#30b45a}
.nav{display:flex;align-items:center;gap:8px;padding:4px 14px 10px}
.nav .t{flex:1;text-align:center;font-weight:600;font-size:15px}
.ib{border:0;background:var(--card);color:var(--blue);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:600;cursor:pointer}
.tx{border:0;background:var(--card);color:var(--blue);height:36px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
#sheet{margin:0 8px;background:var(--card);border-radius:18px;padding:10px 6px 8px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
#sheet .ttl{font-size:13px;font-weight:600;text-align:center;margin-bottom:6px}
.g{display:grid;grid-template-columns:36px repeat(7,1fr)}
.dh{text-align:center;font-size:10px;color:var(--mute);padding-bottom:4px;line-height:1.25}
.dh b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.dh.today b{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;margin:0 auto}
#grid,#ov{grid-template-rows:repeat(26,22px) 88px}#grid{touch-action:pan-y}#gw{position:relative}
#ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.blk{margin:1px 1.5px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;line-height:1.1;padding:0 2px;overflow:hidden;word-break:break-all;background:hsl(var(--h) 85% 88%);color:hsl(var(--h) 55% 26%)}
.lb{font-size:9px;color:var(--mute);text-align:right;padding-right:5px;border-top:1px solid var(--line);line-height:11px;padding-top:1px}
.lb.h{color:var(--ink);font-weight:600}.lb.n{background:var(--night);border-radius:6px 0 0 6px;font-weight:600}
.c{border-top:1px dashed var(--line);border-left:1px solid var(--line);position:relative}
.c.h{border-top:1px solid var(--line)}.c.n{background:var(--night)}
.c.sel{outline:2px solid var(--blue);outline-offset:-2px;z-index:3;background-image:linear-gradient(rgba(0,122,255,.25),rgba(0,122,255,.25))}
#dock{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
#top{position:sticky;top:0;z-index:5;padding:8px 0 4px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#hint{font-size:12px;color:var(--mute);text-align:center;min-height:15px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none}
.chip{--h:210;flex:none;display:flex;align-items:center;gap:7px;border:2px solid transparent;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--soft)}
.chip.nm{background:hsl(var(--h) 85% 90%);color:hsl(var(--h) 55% 26%)}
.chip.nm::before{content:"";width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 60% 42%)}
.chip.on{border-color:var(--blue)}
@media(prefers-color-scheme:dark){.chip.nm{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 80% 86%)}.blk{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 80% 86%)}}
.chip.er{background:var(--soft);color:#ff3b30;border:2px solid var(--line)}
.chip.add{background:var(--soft);color:var(--blue);border:2px solid var(--line)}
.row{display:flex;gap:8px}.row .tx{flex:1;background:var(--soft)}
#sheetm{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;padding:12px;z-index:9}
#sheetm div{width:100%;display:flex;flex-direction:column;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
#sheetm button{border:0;background:var(--card);color:var(--blue);font-size:17px;padding:15px;border-radius:14px;cursor:pointer}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(30,30,32,.9);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="bar"><h1>Care Rota</h1><span class="pill" id="st">Local</span></div>
<div id="top"><div id="chips"></div><div id="hint"></div></div>
<div class="nav"><button class="ib" id="prev">‹</button><div class="t" id="wk"></div><button class="ib" id="next">›</button><button class="tx" id="today">Today</button></div>
<div id="sheet"><div class="ttl" id="ttl"></div><div class="g" id="heads"></div><div id="gw"><div class="g" id="grid"></div><div class="g" id="ov"></div></div></div>
<div id="dock">
  <div class="row"><button class="tx" id="undo">Undo</button><button class="tx" id="exp">Export</button></div>
</div>
<div id="sheetm"><div><button id="ejpg">Save as JPEG</button><button id="epdf">Save as PDF</button><button id="ecan" style="color:var(--ink)">Cancel</button></div></div>
<div id="toast"></div>
<script>
/* ===== 1. PASTE YOUR FIREBASE CONFIG HERE (leave as is for local-only mode) ===== */
const firebaseConfig = {
  apiKey: "", authDomain: "", databaseURL: "", projectId: "", appId: ""
};
/* ================================================================================= */

const DEFAULTS=["HYE","ALIM","BASIT","HAFIZ","KAYYUM","BISAB","HAL","SOF","AFFA"];
const PAL=[210,350,140,30,270,175,50,320,95,0,235,15,300,120];
const hue=n=>n.h??parseInt(((n.c||'').match(/\d+/)||[210])[0]);
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const $=id=>document.getElementById(id);
let names={}, data={}, tool=null, tapA=null, undoS=[], db=null, local=JSON.parse(localStorage.rota||'{"names":null,"weeks":{}}');

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
let ws=monday(new Date());
const wkKey=()=>iso(ws);

function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1600)}

/* ---------- storage ---------- */
const hasFb=firebaseConfig.apiKey&&firebaseConfig.databaseURL;
function seed(){const o={};DEFAULTS.forEach((n,i)=>o[n.toLowerCase()]={n,h:PAL[i%PAL.length]});return o}
function saveLocal(){localStorage.rota=JSON.stringify(local)}
let wref=null;
function listen(){
  if(!hasFb){names=local.names||(local.names=seed());data=local.weeks[wkKey()]||{};render();return}
  if(wref)wref.off();
  wref=db.ref('weeks/'+wkKey());
  wref.on('value',s=>{data=s.val()||{};render()});
}
function writeCells(upd){
  if(hasFb){db.ref('weeks/'+wkKey()).update(upd)}
  else{const w=local.weeks[wkKey()]||(local.weeks[wkKey()]={});for(const k in upd){if(upd[k]==null)delete w[k];else w[k]=upd[k]}data=w;saveLocal();render()}
}
function saveName(id,obj){
  if(hasFb)db.ref('names/'+id).set(obj);else{names[id]=obj;local.names=names;saveLocal();chips()}
}
if(hasFb){
  firebase.initializeApp(firebaseConfig);db=firebase.database();
  db.ref('names').on('value',s=>{
    if(!s.exists()){db.ref('names').set(seed());return}
    names=s.val();chips();render();
  });
  db.ref('.info/connected').on('value',s=>{const p=$('st');p.textContent=s.val()?'Live':'Offline';p.className='pill'+(s.val()?' live':'')});
}else{names=local.names||(local.names=seed());saveLocal()}

/* ---------- rendering ---------- */
const slotLabel=s=>{const m=9*60+s*30;return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
function render(){
  const we=new Date(ws);we.setDate(we.getDate()+6);
  const fm=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const title=`${fm(ws)} – ${fm(we)} ${we.getFullYear()}`;
  $('wk').textContent=title;$('ttl').textContent='Care Rota · '+title;
  const todayIso=iso(new Date());
  let h='<div></div>';
  for(let d=0;d<7;d++){const x=new Date(ws);x.setDate(x.getDate()+d);h+=`<div class="dh ${iso(x)===todayIso?'today':''}">${DAYS[d]}<b>${x.getDate()}</b></div>`}
  $('heads').innerHTML=h;
  let g='';
  for(let s=0;s<27;s++){
    const night=s===26,hr=s%2===0&&!night;
    g+=`<div class="lb ${hr?'h':''} ${night?'n':''}">${night?'22:00<br>Night':hr?slotLabel(s):':30'}</div>`;
    for(let d=0;d<7;d++){
      g+=`<div class="c ${hr?'h':''} ${night?'n':''}" data-d="${d}" data-s="${s}"></div>`;
    }
  }
  $('grid').innerHTML=g;
  const blocks=[];
  for(let d=0;d<7;d++){
    let s=0;
    while(s<27){
      const v=data[d+'_'+s];
      if(!v){s++;continue}
      let e=s;while(e<25&&s<26&&data[d+'_'+(e+1)]===v)e++;
      const last=blocks.find(b=>b.v===v&&b.s0===s&&b.s1===e&&b.d1===d-1);
      if(last)last.d1=d;else blocks.push({v,s0:s,s1:e,d0:d,d1:d});
      s=e+1;
    }
  }
  $('ov').innerHTML=blocks.map(b=>{const nm=names[b.v]||{n:'?',h:0};
    return `<div class="blk" style="--h:${hue(nm)};grid-column:${b.d0+2}/span ${b.d1-b.d0+1};grid-row:${b.s0+1}/span ${b.s1-b.s0+1}">${nm.n}</div>`}).join('');
  paint();
}
function chips(){
  let h='';
  for(const id in names)h+=`<button class="chip nm ${tool===id?'on':''}" data-id="${id}" style="--h:${hue(names[id])}">${names[id].n}</button>`;
  h+=`<button class="chip er ${tool==='erase'?'on':''}" data-id="erase">Erase</button><button class="chip add" data-id="add">+ Name</button>`;
  $('chips').innerHTML=h;
  $('hint').textContent=tapA?'Now tap the end time':tool?(tool==='erase'?'Erase: tap or hold & drag over times':'Tap start & end, or hold & drag'):'Pick a name below';
}
$('chips').onclick=e=>{
  const b=e.target.closest('.chip');if(!b)return;const id=b.dataset.id;
  if(id==='add'){
    const n=(prompt('New name')||'').trim().toUpperCase().slice(0,8);if(!n)return;
    const key=n.toLowerCase().replace(/[^a-z0-9]/g,'')||('n'+Date.now());
    saveName(key,{n,h:PAL[Object.keys(names).length%PAL.length]});tool=key;
    if(!hasFb)chips();return;
  }
  tool=tool===id?null:id;tapA=null;chips();paint();
};

/* ---------- selecting ---------- */
let A=null,C=null,drag=false,hold=null,sxy=[0,0];
const cellAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest&&e.closest('.c')};
const pos=c=>({d:+c.dataset.d,s:+c.dataset.s});
const rect=(a,b)=>({d0:Math.min(a.d,b.d),d1:Math.max(a.d,b.d),s0:Math.min(a.s,b.s),s1:Math.max(a.s,b.s)});
function paint(){
  const a=drag?A:tapA,b=drag?C:tapA;
  document.querySelectorAll('.c.sel').forEach(c=>c.classList.remove('sel'));
  if(!a)return;const r=rect(a,b);
  for(let d=r.d0;d<=r.d1;d++)for(let s=r.s0;s<=r.s1;s++){const c=$('grid').children[s*8+1+d];c&&c.classList.add('sel')}
}
function commit(a,b){
  if(!tool){toast('Pick a name first');return}
  const r=rect(a,b),upd={},prev={};
  for(let d=r.d0;d<=r.d1;d++)for(let s=r.s0;s<=r.s1;s++){const k=d+'_'+s;prev[k]=data[k]??null;upd[k]=tool==='erase'?null:tool}
  undoS.push({wk:wkKey(),prev});writeCells(upd);
}
function tap(p){
  if(!tool){toast('Pick a name first');return}
  if(tapA){const a=tapA;tapA=null;commit(a,p);chips()}else{tapA=p;chips();paint()}
}
function down(c,x,y,touch){
  A=C=pos(c);sxy=[x,y];drag=false;
  if(touch)hold=setTimeout(()=>{drag=true;tapA=null;navigator.vibrate&&navigator.vibrate(8);paint()},220);
  else{drag=true;paint()}
}
function move(x,y,e){
  if(!A)return;
  if(!drag){if(Math.hypot(x-sxy[0],y-sxy[1])>8){clearTimeout(hold);A=null}return}
  if(e.cancelable)e.preventDefault();
  const c=cellAt(x,y);if(c){C=pos(c);paint()}
}
function up(){
  clearTimeout(hold);if(!A)return;
  const moved=drag&&(A.d!==C.d||A.s!==C.s),a=A,c=C;
  A=null;drag=false;
  if(moved){tapA=null;commit(a,c);chips()}else tap(a);
  paint();
}
const G=$('grid');
G.addEventListener('touchstart',e=>{const c=e.target.closest('.c');if(c){const t=e.touches[0];down(c,t.clientX,t.clientY,true)}},{passive:true});
G.addEventListener('touchmove',e=>{const t=e.touches[0];move(t.clientX,t.clientY,e)},{passive:false});
G.addEventListener('touchend',e=>{if(A&&e.cancelable)e.preventDefault();up()});
G.addEventListener('touchcancel',()=>{clearTimeout(hold);A=null;drag=false;paint()});
G.addEventListener('mousedown',e=>{const c=e.target.closest('.c');if(c)down(c,e.clientX,e.clientY,false)});
window.addEventListener('mousemove',e=>move(e.clientX,e.clientY,e));
window.addEventListener('mouseup',up);

/* ---------- nav / undo ---------- */
function go(n){ws.setDate(ws.getDate()+n);tapA=null;listen();chips()}
$('prev').onclick=()=>go(-7);$('next').onclick=()=>go(7);
$('today').onclick=()=>{ws=monday(new Date());tapA=null;listen();chips()};
$('undo').onclick=()=>{
  const u=undoS.pop();if(!u){toast('Nothing to undo');return}
  if(u.wk!==wkKey()){ws=new Date(u.wk+'T00:00:00');listen()}
  const upd={};for(const k in u.prev)upd[k]=u.prev[k];writeCells(upd);
};

/* ---------- export ---------- */
$('exp').onclick=()=>$('sheetm').style.display='flex';
$('ecan').onclick=()=>$('sheetm').style.display='none';
async function snap(){
  $('sheetm').style.display='none';tapA=null;paint();toast('Preparing…');
  return html2canvas($('sheet'),{scale:2,backgroundColor:getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#fff'});
}
$('ejpg').onclick=async()=>{
  const cv=await snap(),a=document.createElement('a');
  a.href=cv.toDataURL('image/jpeg',.95);a.download=`care-rota-${wkKey()}.jpg`;a.click();
};
$('epdf').onclick=async()=>{
  const cv=await snap(),{jsPDF}=window.jspdf,p=new jsPDF({unit:'pt',format:'a4'});
  const W=p.internal.pageSize.getWidth()-40,H=p.internal.pageSize.getHeight()-40;
  let w=W,h=cv.height*W/cv.width;if(h>H){h=H;w=cv.width*H/cv.height}
  p.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(p.internal.pageSize.getWidth()-w)/2,20,w,h);
  p.save(`care-rota-${wkKey()}.pdf`);
};

chips();listen();
</script>
</body>
</html>
